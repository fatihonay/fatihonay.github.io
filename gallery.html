<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · Fatih Onay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="site-header"></div>
  <script src="assets/site.js"></script>

  <main class="container">
    <h1>Gallery</h1>
    <p class="lead">Lab, conferences, fieldwork and figures from my research. Click a photo to enlarge it.</p>

    <!-- To add a photo: put it in assets/img/ and replace a placeholder div with
         <img src="assets/img/your-photo.jpg" alt="Short description"> -->
    <div class="gallery">
      <figure>
        <div class="photo-placeholder">assets/img/lab.jpg</div>
        <figcaption>EEG lab setup</figcaption>
      </figure>
      <figure>
        <div class="photo-placeholder">assets/img/conference.jpg</div>
        <figcaption>Talk at a conference</figcaption>
      </figure>
      <figure>
        <div class="photo-placeholder">assets/img/figure1.png</div>
        <figcaption>Example result figure</figcaption>
      </figure>
      <figure>
        <div class="photo-placeholder">assets/img/team.jpg</div>
        <figcaption>Research group</figcaption>
      </figure>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
